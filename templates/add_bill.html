{% extends 'base.html' %}
{% block title %}Generate Bill – HMS{% endblock %}
{% block page_title %}Generate Bill{% endblock %}

{% block content %}
<div class="page-header">
  <div><h1>➕ Generate Bill</h1></div>
  <a href="{{ url_for('billing') }}" class="btn btn-outline">← Back</a>
</div>
<div class="card">
  <div class="card-header"><h2>🧾 Bill Details</h2></div>
  <div class="card-body">
    <form method="POST">
      <div class="form-grid">
        <div class="form-group">
          <label>Patient *</label>
          <select name="patient_id" required>
            <option value="">Select Patient</option>
            {% for p in patients %}
            <option value="{{ p.patient_id }}">{{ p.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Payment Date *</label>
          <input type="date" name="payment_date" required>
        </div>
        <div class="form-group">
          <label>Payment Method</label>
          <select name="payment_method">
            <option>Cash</option>
            <option>Card</option>
            <option>UPI</option>
            <option>Insurance</option>
            <option>Online</option>
          </select>
        </div>
        <div class="form-group">
          <label>Payment Status</label>
          <select name="payment_status">
            <option>Paid</option>
            <option>Pending</option>
            <option>Partial</option>
          </select>
        </div>
        <div class="form-group">
          <label>Doctor Fee (₹)</label>
          <input type="number" id="doctor_fee" name="doctor_fee" step="0.01" value="0" oninput="calcTotal()">
        </div>
        <div class="form-group">
          <label>Medicine Fee (₹)</label>
          <input type="number" id="medicine_fee" name="medicine_fee" step="0.01" value="0" oninput="calcTotal()">
        </div>
        <div class="form-group">
          <label>Room Charge (₹)</label>
          <input type="number" id="room_charge" name="room_charge" step="0.01" value="0" oninput="calcTotal()">
        </div>
        <div class="form-group">
          <label>Total Amount (₹)</label>
          <input type="number" id="total_display" step="0.01" value="0" readonly
                 style="background:#f0f5fb; font-weight:700; color:#1a5f9e;">
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">✅ Generate Bill</button>
        <a href="{{ url_for('billing') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
<script>
function calcTotal() {
  const d = parseFloat(document.getElementById('doctor_fee').value) || 0;
  const m = parseFloat(document.getElementById('medicine_fee').value) || 0;
  const r = parseFloat(document.getElementById('room_charge').value) || 0;
  document.getElementById('total_display').value = (d + m + r).toFixed(2);
}
</script>
{% endblock %}
