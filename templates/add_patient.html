{% extends 'base.html' %}
{% block title %}Add Patient – HMS{% endblock %}
{% block page_title %}Add Patient{% endblock %}

{% block content %}
<div class="page-header">
  <div><h1>➕ Add New Patient</h1><p>Register a new patient in the system</p></div>
  <a href="{{ url_for('patients') }}" class="btn btn-outline">← Back</a>
</div>

<div class="card">
  <div class="card-header"><h2>🧑‍⚕️ Patient Information</h2></div>
  <div class="card-body">
    <form method="POST">
      <div class="form-grid">
        <div class="form-group">
          <label>First Name *</label>
          <input type="text" name="first_name" required placeholder="e.g. Rahul">
        </div>
        <div class="form-group">
          <label>Middle Name</label>
          <input type="text" name="middle_name" placeholder="e.g. Kumar">
        </div>
        <div class="form-group">
          <label>Last Name *</label>
          <input type="text" name="last_name" required placeholder="e.g. Sharma">
        </div>
        <div class="form-group">
          <label>Date of Birth *</label>
          <input type="date" name="dob" required>
        </div>
        <div class="form-group">
          <label>Gender *</label>
          <select name="gender" required>
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>Blood Group *</label>
          <select name="blood_group" required>
            <option value="">Select</option>
            <option>A+</option><option>A-</option>
            <option>B+</option><option>B-</option>
            <option>O+</option><option>O-</option>
            <option>AB+</option><option>AB-</option>
          </select>
        </div>
        <div class="form-group">
          <label>Phone Number *</label>
          <input type="text" name="phone_no" required placeholder="e.g. 9876543210">
        </div>
        <div class="form-group form-full">
          <label>Address</label>
          <textarea name="address" placeholder="Full address..."></textarea>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">✅ Register Patient</button>
        <a href="{{ url_for('patients') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
