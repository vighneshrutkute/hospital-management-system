{% extends 'base.html' %}
{% block title %}Add Treatment – HMS{% endblock %}
{% block page_title %}Add Treatment{% endblock %}

{% block content %}
<div class="page-header">
  <div><h1>➕ Add Treatment</h1></div>
  <a href="{{ url_for('treatments') }}" class="btn btn-outline">← Back</a>
</div>
<div class="card">
  <div class="card-header"><h2>💊 Treatment Details</h2></div>
  <div class="card-body">
    <form method="POST">
      <div class="form-grid">
        <div class="form-group">
          <label>Patient *</label>
          <select name="patient_id" required>
            <option value="">Select Patient</option>
            {% for p in patients %}
            <option value="{{ p.patient_id }}">{{ p.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Doctor *</label>
          <select name="doctor_id" required>
            <option value="">Select Doctor</option>
            {% for d in doctors %}
            <option value="{{ d.doctor_id }}">{{ d.dname }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Diagnosis *</label>
          <input type="text" name="diagnosis" required placeholder="e.g. High Blood Pressure">
        </div>
        <div class="form-group">
          <label>Status</label>
          <select name="status">
            <option>Ongoing</option>
            <option>Completed</option>
            <option>Scheduled</option>
          </select>
        </div>
        <div class="form-group">
          <label>Treatment Date *</label>
          <input type="date" name="treatment_date" required>
        </div>
        <div class="form-group form-full">
          <label>Treatment Description</label>
          <textarea name="treatment_desc" placeholder="Describe the treatment plan..."></textarea>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">✅ Save Treatment</button>
        <a href="{{ url_for('treatments') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
