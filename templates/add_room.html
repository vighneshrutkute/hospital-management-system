{% extends 'base.html' %}
{% block title %}Add Room – HMS{% endblock %}
{% block page_title %}Add Room{% endblock %}

{% block content %}
<div class="page-header">
  <div><h1>➕ Add Room</h1></div>
  <a href="{{ url_for('rooms') }}" class="btn btn-outline">← Back</a>
</div>
<div class="card">
  <div class="card-header"><h2>🛏️ Room Details</h2></div>
  <div class="card-body">
    <form method="POST">
      <div class="form-grid">
        <div class="form-group">
          <label>Room Number *</label>
          <input type="number" name="room_no" required placeholder="e.g. 104">
        </div>
        <div class="form-group">
          <label>Room Type *</label>
          <select name="room_type" required>
            <option>General</option>
            <option>ICU</option>
            <option>Private</option>
            <option>Semi-Private</option>
            <option>Emergency</option>
          </select>
        </div>
        <div class="form-group">
          <label>Status</label>
          <select name="status">
            <option>Available</option>
            <option>Occupied</option>
            <option>Maintenance</option>
          </select>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">✅ Add Room</button>
        <a href="{{ url_for('rooms') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
