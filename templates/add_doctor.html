{% extends 'base.html' %}
{% block title %}Add Doctor – HMS{% endblock %}
{% block page_title %}Add Doctor{% endblock %}

{% block content %}
<div class="page-header">
  <div><h1>➕ Add New Doctor</h1></div>
  <a href="{{ url_for('doctors') }}" class="btn btn-outline">← Back</a>
</div>
<div class="card">
  <div class="card-header"><h2>👨‍⚕️ Doctor Information</h2></div>
  <div class="card-body">
    <form method="POST">
      <div class="form-grid">
        <div class="form-group">
          <label>Full Name *</label>
          <input type="text" name="dname" required placeholder="e.g. Dr. Raj Sharma">
        </div>
        <div class="form-group">
          <label>Specialization *</label>
          <input type="text" name="specialization" required placeholder="e.g. Cardiologist">
        </div>
        <div class="form-group">
          <label>Qualification *</label>
          <input type="text" name="qualification" required placeholder="e.g. MBBS, MD">
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="text" name="phone_no" placeholder="e.g. 9876543210">
        </div>
        <div class="form-group">
          <label>Consultation Fee (₹)</label>
          <input type="number" name="consultation_fee" step="0.01" placeholder="e.g. 800">
        </div>
        <div class="form-group">
          <label>Joining Date</label>
          <input type="date" name="joining_date">
        </div>
        <div class="form-group">
          <label>Department</label>
          <select name="dept_id">
            <option value="">Select Department</option>
            {% for d in depts %}
            <option value="{{ d.dept_id }}">{{ d.dept_name }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">✅ Add Doctor</button>
        <a href="{{ url_for('doctors') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
