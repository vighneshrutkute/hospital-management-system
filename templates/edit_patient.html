{% extends 'base.html' %}
{% block title %}Edit Patient – HMS{% endblock %}
{% block page_title %}Edit Patient{% endblock %}

{% block content %}
<div class="page-header">
  <div><h1>✏️ Edit Patient</h1><p>Update patient #{{ patient.patient_id }} details</p></div>
  <a href="{{ url_for('patients') }}" class="btn btn-outline">← Back</a>
</div>

<div class="card">
  <div class="card-header"><h2>🧑‍⚕️ Edit Information</h2></div>
  <div class="card-body">
    <form method="POST">
      <div class="form-grid">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" name="first_name" value="{{ patient.first_name }}" required>
        </div>
        <div class="form-group">
          <label>Middle Name</label>
          <input type="text" name="middle_name" value="{{ patient.middle_name or '' }}">
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" name="last_name" value="{{ patient.last_name }}" required>
        </div>
        <div class="form-group">
          <label>Date of Birth</label>
          <input type="date" name="dob" value="{{ patient.dob }}" required>
        </div>
        <div class="form-group">
          <label>Gender</label>
          <select name="gender" required>
            {% for g in ['Male','Female','Other'] %}
            <option {{ 'selected' if patient.gender == g }}>{{ g }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Blood Group</label>
          <select name="blood_group" required>
            {% for bg in ['A+','A-','B+','B-','O+','O-','AB+','AB-'] %}
            <option {{ 'selected' if patient.blood_group == bg }}>{{ bg }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="text" name="phone_no" value="{{ patient.phone_no }}">
        </div>
        <div class="form-group form-full">
          <label>Address</label>
          <textarea name="address">{{ patient.address }}</textarea>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">💾 Save Changes</button>
        <a href="{{ url_for('patients') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
