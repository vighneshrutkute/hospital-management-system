{% extends 'base.html' %}
{% block title %}Add Medicine – HMS{% endblock %}
{% block page_title %}Add Medicine{% endblock %}

{% block content %}
<div class="page-header">
  <div><h1>➕ Add Medicine</h1></div>
  <a href="{{ url_for('medicines') }}" class="btn btn-outline">← Back</a>
</div>
<div class="card">
  <div class="card-header"><h2>💉 Medicine Details</h2></div>
  <div class="card-body">
    <form method="POST">
      <div class="form-grid">
        <div class="form-group">
          <label>Medicine Name *</label>
          <input type="text" name="medicine_name" required placeholder="e.g. Paracetamol">
        </div>
        <div class="form-group">
          <label>Price (₹) *</label>
          <input type="number" name="price" step="0.01" required placeholder="e.g. 50.00">
        </div>
        <div class="form-group">
          <label>Expiry Date *</label>
          <input type="date" name="expiry_date" required>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">✅ Add Medicine</button>
        <a href="{{ url_for('medicines') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
